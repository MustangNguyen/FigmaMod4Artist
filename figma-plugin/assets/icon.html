<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0}
body{width:128px;height:128px;background:#2f56c9;display:grid;place-items:center;overflow:hidden}
.c{position:relative;width:84px;height:84px}
.a{position:absolute;left:0;top:0;width:68px;height:66px;background:#fff;border-radius:8px 0 0 0;display:grid;place-items:center;font:700 30px "IBM Plex Mono",monospace;color:#2f56c9}
.r,.b{position:absolute;background:repeating-linear-gradient(45deg,rgba(255,255,255,.85) 0 2px,transparent 2px 6px)}
.r{left:68px;top:0;width:16px;height:84px;border-radius:0 8px 8px 0}
.b{left:0;top:66px;width:68px;height:18px;border-radius:0 0 0 8px}
</style></head><body><div class="c"><div class="a">×4</div><div class="r"></div><div class="b"></div></div></body></html>
